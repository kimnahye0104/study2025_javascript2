<body>
    <!-- 반복문 -->
     <h1>반복문(for) 알아보기</h1>
     <p>동일한 작업을 반복해서 활용할 수 있음.</p>
     <p>for, while, do while</p>
     <p> ;(세미콜론)으로 구분.</p>
     <p> <mark>for( 초기값; 조건; 코드 실행 후 작업 ){  //반복할코드  }</mark> 순으로 작성한다.</p>
     <p> <mark>let i = 0; while(i=10){  // 코드  }</mark> 순으로 작성한다.</p>
     <br>
     <p>반복문 안의 <mark>'조건'이 'false'가 되면 </mark>멈춘다. (조건이 true이면 계속 실행.)</p>
     <p><em>반복문 멈추는 방법(break, continue)</em></p>
     <p><em><mark>break : 멈추고 빠져나옴.</mark></em></p>
     <p><em><mark>continue : 멈추고 다음 반복 실행.</mark></em></p>
</body>
